openapi: 3.1.0
info:
  title: Smart CA Backend API
  version: 1.0.0
  description: |
    REST API for Smart CA practice management.
    PostgreSQL-backed Go service. Browser calls go through `/api/v1` (Docker nginx same-origin proxy or direct to `:8080` in native dev).
    Authentication uses opaque Bearer tokens stored in `auth_sessions`.
servers:
  - url: /
    description: Same-origin (Docker nginx on :8080 proxies /api/* and /health/*)
  - url: http://localhost:8080
    description: Explicit host (Docker Compose or native Go API)
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              example:
                success: true
                data: { status: live }
                meta: { requestId: "uuid" }
  /health/ready:
    get:
      security: []
      summary: Readiness probe (DB reachable)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              example:
                success: true
                data: { status: ready }
                meta: { requestId: "uuid" }
  /version:
    get:
      security: []
      summary: Build version
      responses:
        "200":
          description: Version payload
  /api/v1/version:
    get:
      security: []
      summary: Build version (API prefix)
      responses:
        "200":
          description: Version payload
  /api/v1/auth/login:
    post:
      security: []
      summary: Login (email, username, or loginId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, example: rajesh.sharma@smartca.in }
                password: { type: string, example: SmartCA@2025 }
                rememberMe: { type: boolean, default: false }
                device: { type: string, example: Desktop Browser }
            example:
              identifier: rajesh.sharma@smartca.in
              password: SmartCA@2025
              rememberMe: false
      responses:
        "200":
          description: Session created
          content:
            application/json:
              example:
                success: true
                data:
                  user: { id: USR-0001, email: rajesh.sharma@smartca.in, role: super_admin }
                  token: opaque-session-token
                meta: { requestId: "uuid" }
        "401":
          description: Invalid credentials
  /api/v1/auth/logout:
    post:
      summary: Logout (revoke session)
      responses:
        "200":
          description: Logged out
  /api/v1/auth/me:
    get:
      summary: Current user profile + permissions
      responses:
        "200":
          description: User profile
        "401":
          description: Missing/invalid token
  /api/v1/auth/forgot-password:
    post:
      security: []
      summary: Demo forgot password
      responses:
        "200":
          description: Message
  /api/v1/auth/reset-password:
    post:
      security: []
      summary: Demo reset password
      responses:
        "200":
          description: Message
  /api/v1/auth/change-password:
    post:
      summary: Change password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Updated
  /api/v1/demo/reset:
    post:
      summary: Reset demo data (super_admin + DEMO_RESET_ENABLED)
      responses:
        "200":
          description: Reset
        "403":
          description: Forbidden
  /api/v1/clients:
    get:
      summary: List clients (pagination, search, sort)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/status"
        - $ref: "#/components/parameters/sortBy"
        - $ref: "#/components/parameters/sortDir"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              example:
                success: true
                data: [{ id: CLT-0001, name: Example Client }]
                meta:
                  requestId: uuid
                  pagination: { page: 1, pageSize: 50, totalItems: 120, totalPages: 3 }
    post:
      summary: Create client
      requestBody:
        content:
          application/json:
            example:
              name: Acme Traders
              email: acme@example.com
              phone: "9876543210"
              type: company
              status: active
      responses:
        "200":
          description: Created
        "403":
          description: Missing clients.create
  /api/v1/clients/{id}:
    get:
      summary: Get client
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Record
    patch:
      summary: Update client
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated
    delete:
      summary: Permanent delete
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted
  /api/v1/clients/{id}/archive:
    post:
      summary: Archive client
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Archived
  /api/v1/companies:
    get:
      summary: List companies
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortBy"
        - $ref: "#/components/parameters/sortDir"
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create company
      responses:
        "200":
          description: Created
  /api/v1/employees:
    get:
      summary: List employees
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: Paginated list
  /api/v1/documents:
    get:
      summary: List document metadata
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create document metadata record
      responses:
        "200":
          description: Created
  /api/v1/tasks:
    get:
      summary: List tasks
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Paginated list
  /api/v1/work/items:
    get:
      summary: List work items (Practice Core)
      description: Requires `work.view`. Status filter accepts practice status enums.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PracticeStatus" }
        - name: clientId
          in: query
          schema: { type: string }
        - name: assigneeId
          in: query
          schema: { type: string }
        - name: ownerCaId
          in: query
          schema: { type: string }
        - name: tlId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated work items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkItem" }
    post:
      summary: Create work item
      description: Requires `work.create`. Assignee optional (OPEN / DOCUMENT_PENDING); triad via `/assign`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkItemCreate" }
            example:
              title: GSTR-3B Mar 2026
              clientId: CLT-0001
              companyId: CMP-0001
              workType: GSTR3B
              periodKey: 2026-03
              riskClass: medium
              status: OPEN
              ownerCaId: WM-CA-0001
              tlId: WM-TL-0001
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WorkItem" }
        "403":
          description: Missing work.create
        "409":
          description: Duplicate period / conflict
  /api/v1/work/items/{id}:
    get:
      summary: Get work item
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Work item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WorkItem" }
    patch:
      summary: Update work item (free-status PATCH only)
      description: |
        Requires `work.edit`. Gated statuses (READY_FOR_*, CLOSED, etc.) must use
        `/transitions`, `/verify/*`, `/close`, or `/reopen` — not PATCH.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkItemUpdate" }
      responses:
        "200":
          description: Updated work item
        "409":
          description: Gate status cannot be set via PATCH
  /api/v1/work/items/{id}/assign:
    post:
      summary: Assign ownership triad slot (owner_ca | tl | assignee)
      description: Requires `work.assign`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot, userId]
              properties:
                slot: { type: string, enum: [owner_ca, tl, assignee] }
                userId: { type: string }
                userName: { type: string }
                userRole: { type: string }
            example:
              slot: assignee
              userId: WM-EMP-0001
              userName: Emp One
              userRole: employee
      responses:
        "200":
          description: Updated work item
        "403":
          description: Missing work.assign or role cannot set slot
  /api/v1/work/items/{id}/transitions:
    post:
      summary: Practice status transition (non-verify edges)
      description: Requires `work.transition`. Use for READY_FOR_TL_VERIFY and operational edges; verify/close/reopen have dedicated APIs.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/PracticeStatus" }
                remarks: { type: string }
                overlay: { type: string, example: GSTR3B_FILED }
            example:
              to: READY_FOR_TL_VERIFY
              remarks: Prep complete
      responses:
        "200":
          description: Transitioned work item
        "409":
          description: Illegal edge / status conflict
  /api/v1/work/items/{id}/verify/tl:
    post:
      summary: TL verify gate (pass → READY_FOR_CA_VERIFY, fail → TL_REJECTED)
      description: Requires `work.verify.tl`. Decision `pass` or `fail`; remarks required on fail.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyDecision" }
            example: { decision: pass, remarks: Looks good }
      responses:
        "200":
          description: Verified work item
        "403":
          description: Missing work.verify.tl (Manager SoD strips this)
        "409":
          description: Not READY_FOR_TL_VERIFY or concurrent conflict
  /api/v1/work/items/{id}/verify/ca:
    post:
      summary: CA verify gate (pass → READY_FOR_MANAGER_CLOSE / DELIVERED, fail → CA_REJECTED)
      description: Requires `work.verify.ca`. Same actor cannot both pass TL and act on CA verify (SoD).
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyDecision" }
            example: { decision: pass, remarks: Approved }
      responses:
        "200":
          description: Verified work item
        "403":
          description: Missing work.verify.ca or SoD violation
        "409":
          description: Not READY_FOR_CA_VERIFY or concurrent conflict
  /api/v1/work/items/{id}/close:
    post:
      summary: Manager/Partner close (→ CLOSED)
      description: Requires `work.close.manager` (or `work.close.partner` when `requiresPartnerSignoff`).
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks: { type: string }
            example: { remarks: Filing complete }
      responses:
        "200":
          description: Closed work item
        "403":
          description: Insufficient close permission
        "409":
          description: Not READY_FOR_MANAGER_CLOSE/DELIVERED or concurrent conflict
  /api/v1/work/items/{id}/reopen:
    post:
      summary: Reopen CLOSED work (→ OPEN)
      description: Requires `work.reopen`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
            example: { reason: Client amendment }
      responses:
        "200":
          description: Reopened work item
        "409":
          description: Not CLOSED
  /api/v1/work/items/{id}/checklist:
    get:
      summary: List document checklist for work item
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Checklist rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ChecklistItem" }
    post:
      summary: Add checklist item
      description: Requires `work.edit`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistItemCreate" }
            example: { code: BANK_STMT, label: Bank statement }
      responses:
        "201":
          description: Created checklist item
  /api/v1/work/items/{id}/checklist/{cid}/verify:
    post:
      summary: Verify or reject checklist item
      description: |
        Requires `work.view` at route; service allows TL/CA/Manager.
        Decision `pass`/`verified` or `fail`/`rejected` (remarks required on reject).
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/cid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyDecision" }
            examples:
              verify:
                value: { decision: pass, remarks: Received }
              reject:
                value: { decision: fail, remarks: Illegible scan }
      responses:
        "200":
          description: Updated checklist item
        "403":
          description: Role cannot verify checklist
  /api/v1/work/intakes:
    get:
      summary: List intakes
      description: Requires `work.view` (leadership/reception/intake perms enforced in service).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [INTAKE, APPROVED, REJECTED] }
      responses:
        "200":
          description: Intake list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Intake" }
    post:
      summary: Create intake (reception pre-master)
      description: Requires `intake.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeCreate" }
            example:
              source: walk_in
              contactName: Ravi Patel
              contactPhone: "9876543210"
              services: [GST, ITR]
              notes: New walk-in
      responses:
        "201":
          description: Created intake (status INTAKE)
        "403":
          description: Missing intake.create
  /api/v1/work/intakes/{id}/approve:
    post:
      summary: Approve intake → engagement
      description: Requires `intake.approve`. Creates engagement atomically.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, ownerCaId]
              properties:
                clientId: { type: string }
                companyId: { type: string }
                ownerCaId: { type: string }
                engagementTitle: { type: string }
                services:
                  type: array
                  items: { type: string }
            example:
              clientId: CLT-0001
              companyId: CMP-0001
              ownerCaId: WM-CA-0001
              engagementTitle: FY26 retainer
              services: [GST, ITR]
      responses:
        "200":
          description: Approved intake
        "400":
          description: Invalid clientId / validation
        "409":
          description: Intake not INTAKE
  /api/v1/work/intakes/{id}/reject:
    post:
      summary: Reject intake
      description: Requires `intake.reject`. Remarks required.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarks]
              properties:
                remarks: { type: string }
            example: { remarks: Incomplete KYC }
      responses:
        "200":
          description: Rejected intake
        "409":
          description: Intake not INTAKE
  /api/v1/work/engagements:
    get:
      summary: List engagements
      description: Requires `work.view`. Professionals scoped to own ownerCaId portfolio.
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Engagement list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Engagement" }
    post:
      summary: Create engagement
      description: Requires `engagement.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngagementCreate" }
            example:
              clientId: CLT-0001
              companyId: CMP-0001
              ownerCaId: WM-CA-0001
              title: FY26 GST retainer
              services: [GSTR1, GSTR3B]
              fy: "2025-26"
              status: ACTIVE
      responses:
        "201":
          description: Created engagement
        "400":
          description: Invalid clientId / validation
  /api/v1/notes:
    get:
      summary: List notes
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create note
      requestBody:
        content:
          application/json:
            example:
              title: Follow up
              content: Call client about GST
      responses:
        "200":
          description: Created
  /api/v1/gst:
    get:
      summary: List GST filings
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated list
  /api/v1/itr:
    get:
      summary: List ITR filings
      responses:
        "200":
          description: Paginated list
  /api/v1/tds:
    get:
      summary: List TDS filings
      responses:
        "200":
          description: Paginated list
  /api/v1/roc:
    get:
      summary: List ROC filings
      responses:
        "200":
          description: Paginated list
  /api/v1/invoices:
    get:
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortBy"
        - $ref: "#/components/parameters/sortDir"
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create invoice (server-side GST totals)
      responses:
        "200":
          description: Created
  /api/v1/invoices/{id}:
    get:
      summary: Get invoice
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Record
    patch:
      summary: Update invoice
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete invoice
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted
  /api/v1/payments:
    get:
      summary: List payments
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create payment (reconciles invoice/client)
      responses:
        "200":
          description: Created
        "400":
          description: Validation / overpayment
  /api/v1/dashboard:
    get:
      summary: Live dashboard KPIs
      responses:
        "200":
          description: Dashboard
        "403":
          description: Missing dashboard.view
  /api/v1/reports/summary:
    get:
      summary: Live report series
      responses:
        "200":
          description: Reports
        "403":
          description: Missing reports.view
  /api/v1/search:
    get:
      summary: Cross-collection search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, example: acme }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Results
  /api/v1/accounting/journals:
    get:
      summary: List journals
      responses:
        "200":
          description: Journals
    post:
      summary: Post balanced manual journal
      responses:
        "200":
          description: Created
        "400":
          description: Unbalanced
  /api/v1/accounting/statements:
    get:
      summary: Trial balance, P&L, balance sheet
      responses:
        "200":
          description: Statements
  /api/v1/archive:
    get:
      summary: List archived records
      parameters:
        - name: collection
          in: query
          schema: { type: string, example: clients }
      responses:
        "200":
          description: Archive list
  /api/v1/settings:
    get:
      summary: Get settings
      responses:
        "200":
          description: Settings
    patch:
      summary: Update settings
      responses:
        "200":
          description: Updated
  /api/v1/ai/chat:
    post:
      summary: AI chat (Gemini or mock provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                history: { type: array, items: { type: object } }
                clientId: { type: string }
                maxTokens: { type: integer }
            example:
              message: Summarize outstanding invoices for this firm.
      responses:
        "200":
          description: AI result
          content:
            application/json:
              example:
                success: true
                data:
                  reply: "**(Mock AI)** ..."
                  markdown: "**(Mock AI)** ..."
                  provider: mock
                  model: gemini-2.5-flash
        "403":
          description: Missing ai.view
  /api/v1/ai/summarize:
    post:
      summary: Summarize free text
      requestBody:
        content:
          application/json:
            example: { text: "Long filing notes..." }
      responses:
        "200":
          description: AI result
  /api/v1/ai/email:
    post:
      summary: Draft professional email
      requestBody:
        content:
          application/json:
            example: { purpose: "GST reminder", clientId: "CLT-0001", tone: "professional" }
      responses:
        "200":
          description: AI result
  /api/v1/ai/client-summary:
    post:
      summary: Client dossier summary
      requestBody:
        content:
          application/json:
            example: { clientId: "CLT-0001", question: "Key risks?" }
      responses:
        "200":
          description: AI result
  /api/v1/ai/document-analysis:
    post:
      summary: Document analysis
      requestBody:
        content:
          application/json:
            example: { documentId: "DOC-0001", question: "What is missing?" }
      responses:
        "200":
          description: AI result
  /api/v1/ai/dashboard-insights:
    post:
      summary: Dashboard KPI narrative
      requestBody:
        content:
          application/json:
            example: { focus: "cash collection" }
      responses:
        "200":
          description: AI result
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cid:
      name: cid
      in: path
      required: true
      description: Checklist item id
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    search:
      name: search
      in: query
      schema: { type: string }
    status:
      name: status
      in: query
      schema: { type: string }
    sortBy:
      name: sortBy
      in: query
      schema: { type: string }
    sortDir:
      name: sortDir
      in: query
      schema: { type: string, enum: [asc, desc] }
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            pagination:
              type: object
              properties:
                page: { type: integer }
                pageSize: { type: integer }
                totalItems: { type: integer }
                totalPages: { type: integer }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        meta:
          type: object
          properties:
            requestId: { type: string }
    PracticeStatus:
      type: string
      description: Canonical Practice Core work status (Architecture §6.1)
      enum:
        - OPEN
        - DOCUMENT_PENDING
        - DOCUMENT_RECEIVED
        - IN_PROGRESS
        - BLOCKED
        - ON_HOLD
        - READY_FOR_TL_VERIFY
        - TL_REJECTED
        - TL_VERIFIED
        - READY_FOR_CA_VERIFY
        - CA_REJECTED
        - CA_VERIFIED
        - READY_FOR_MANAGER_CLOSE
        - DELIVERED
        - CLOSED
        - CANCELLED
    RiskClass:
      type: string
      enum: [low, medium, high]
    VerifyDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: pass|fail (checklist also accepts verified|rejected)
          enum: [pass, fail, verified, rejected]
        remarks: { type: string }
    WorkItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        status: { $ref: "#/components/schemas/PracticeStatus" }
        dueDate: { type: string, format: date-time }
        createdDate: { type: string, format: date-time }
        assignedBy: { type: string }
        assignedByName: { type: string }
        assignedTo: { type: string }
        assignedToName: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        companyId: { type: string }
        engagementId: { type: string }
        workType: { type: string }
        periodKey: { type: string }
        fy: { type: string }
        overlay: { type: string }
        riskClass: { $ref: "#/components/schemas/RiskClass" }
        ownerCaId: { type: string, description: Ownership triad — Owner CA }
        tlId: { type: string, description: Ownership triad — Team Leader }
        assigneeId: { type: string, description: Ownership triad — assignee (synced with assignedTo) }
        delegatedClose: { type: boolean }
        requiresPartnerSignoff: { type: boolean }
        department: { type: string }
        tags: { type: array, items: { type: string } }
        estimatedHours: { type: number }
        actualHours: { type: number }
        completionPct: { type: integer }
        parentId: { type: string }
        createdBy: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        childCount: { type: integer }
    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        status: { $ref: "#/components/schemas/PracticeStatus" }
        dueDate: { type: string, format: date-time }
        assignedTo: { type: string }
        assignedToName: { type: string }
        assigneeRole: { type: string }
        assigneeId: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        companyId: { type: string }
        engagementId: { type: string }
        workType: { type: string }
        periodKey: { type: string }
        fy: { type: string }
        overlay: { type: string }
        riskClass: { $ref: "#/components/schemas/RiskClass" }
        ownerCaId: { type: string }
        tlId: { type: string }
        delegatedClose: { type: boolean }
        requiresPartnerSignoff: { type: boolean }
        department: { type: string }
        tags: { type: array, items: { type: string } }
        estimatedHours: { type: number }
        parentId: { type: string }
    WorkItemUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        status:
          $ref: "#/components/schemas/PracticeStatus"
          description: Free statuses only (OPEN, DOCUMENT_*, IN_PROGRESS, BLOCKED, ON_HOLD, *_REJECTED)
        dueDate: { type: string, format: date-time }
        clientName: { type: string }
        department: { type: string }
        tags: { type: array, items: { type: string } }
        estimatedHours: { type: number }
        actualHours: { type: number }
        completionPct: { type: integer }
        overlay: { type: string }
        riskClass: { $ref: "#/components/schemas/RiskClass" }
        delegatedClose: { type: boolean }
        requiresPartnerSignoff: { type: boolean }
    Intake:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [INTAKE, APPROVED, REJECTED] }
        source: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        services: { type: array, items: { type: string } }
        notes: { type: string }
        payload: { type: object, additionalProperties: true }
        createdBy: { type: string }
        approvedBy: { type: string }
        rejectedBy: { type: string }
        rejectRemarks: { type: string }
        clientId: { type: string }
        companyId: { type: string }
        engagementId: { type: string }
        ownerCaId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntakeCreate:
      type: object
      properties:
        source: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        services: { type: array, items: { type: string } }
        notes: { type: string }
        payload: { type: object, additionalProperties: true }
    Engagement:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        companyId: { type: string }
        ownerCaId: { type: string }
        services: { type: array, items: { type: string } }
        status: { type: string, example: ACTIVE }
        fy: { type: string }
        title: { type: string }
        createdBy: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EngagementCreate:
      type: object
      required: [clientId, ownerCaId]
      properties:
        clientId: { type: string }
        companyId: { type: string }
        ownerCaId: { type: string }
        services: { type: array, items: { type: string } }
        status: { type: string, default: ACTIVE }
        fy: { type: string }
        title: { type: string }
    ChecklistItem:
      type: object
      properties:
        id: { type: string }
        workItemId: { type: string }
        code: { type: string }
        label: { type: string }
        status: { type: string, enum: [pending, received, verified, rejected] }
        remarks: { type: string }
        verifiedBy: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChecklistItemCreate:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        status: { type: string, enum: [pending, received], default: pending }
        remarks: { type: string }
